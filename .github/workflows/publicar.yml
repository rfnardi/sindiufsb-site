# Publica o site no GitHub Pages a cada push na main (inclusive os commits
# que o CMS faz pela API) e uma vez por dia, para posts com data futura.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # 06h em Salvador
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Sem domínio próprio o site mora em /<repositório>/; com domínio,
      # base_path vem vazio e o prefixo vira "/".
      - run: npx eleventy --pathprefix="${{ steps.pages.outputs.base_path }}/"
      - run: npx pagefind --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
